    <title>Choose Your Options</title>
    <style>
      body {
        display: flex;
        flex-direction: column;
        align-items: center;
        background-color: #d8ff9c; /* Updated background color */
        margin: 0;
        padding: 20px;
      }
      .sections {
        display: flex;
        justify-content: space-around;
        width: 100%;
        margin-bottom: 20px;
      }
      .section {
        display: flex;
        flex-direction: column;
        align-items: center;
      }
      .section img {
        cursor: pointer;
        width: 100px;
        height: 100px;
        margin: 10px;
        border: 2px solid transparent;
        transition: border 0.3s;
      }
      .section img:hover {
        border: 2px solid #007bff;
      }
      .section-title {
        font-size: 1.5em;
        margin-bottom: 10px;
      }
      .result-box {
        background-color: #f8ffed;
        padding: 20px;
        width: 300px;
        min-height: 200px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
      }
      .result-box img {
        width: 100px;
        height: 100px;
        margin: 0px; /* Reduced margin to bring images closer */
      }
    </style>

    <script>
      function selectImage(section, img) {
        const resultBox = document.getElementById("result-box");
        const newImg = document.createElement("img");
        newImg.src = img.src;
        newImg.alt = img.alt;

        if (section === "flowers") {
          // Remove any previously selected flower
          const existingFlower = resultBox.querySelector(".flower");
          if (existingFlower) {
            resultBox.removeChild(existingFlower);
          }
          newImg.classList.add("flower");
          resultBox.insertBefore(newImg, resultBox.firstChild);
        } else if (section === "vase") {
          // Remove any previously selected vase
          const existingVase = resultBox.querySelector(".vase");
          if (existingVase) {
            resultBox.removeChild(existingVase);
          }
          newImg.classList.add("vase");
          resultBox.appendChild(newImg);
        }
      }
    </script>
  </body>
</html>
